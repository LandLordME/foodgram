name: Foodgram CI/CD
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: foodgram-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: foodgram
          POSTGRES_USER: foodgram
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U foodgram"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-key-not-used-in-production
      DEBUG: "True"
      DB_ENGINE: postgresql
      DB_HOST: 127.0.0.1
      POSTGRES_DB: foodgram
      POSTGRES_USER: foodgram
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-dev.txt
      - name: Lint and check migrations
        run: |
          python -m flake8 backend
          python backend/manage.py check
          python backend/manage.py makemigrations --check --dry-run
      - name: Test API with PostgreSQL
        run: python backend/manage.py test tests
      - name: Run Postman scenarios
        run: |
          python backend/manage.py migrate --noinput
          python backend/manage.py import_ingredients
          python backend/manage.py runserver 127.0.0.1:8000 --noreload > /tmp/foodgram.log 2>&1 &
          python scripts/wait_for_api.py
          npm install --global newman@6.2.3 --no-audit --no-fund
          python scripts/prepare_postman.py
          newman run verification-output/foodgram.postman_collection.json --env-var baseUrl=http://127.0.0.1:8000
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          CI=false npm run build
      - name: Build and smoke-test Docker stack
        run: |
          python scripts/bootstrap_env.py
          docker compose up -d --build --wait --wait-timeout 180
          python scripts/check_site.py http://localhost:8080
      - name: Docker diagnostics
        if: failure()
        run: docker compose logs --tail=100

  publish:
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DOCKERHUB_USERNAME != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: backend
            context: .
            dockerfile: backend/Dockerfile
          - image: frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile
          - image: nginx
            context: .
            dockerfile: infra/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/foodgram-${{ matrix.image }}:latest
            ${{ vars.DOCKERHUB_USERNAME }}/foodgram-${{ matrix.image }}:${{ github.sha }}

  deploy:
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Deploy verified images over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'mkdir -p ~/foodgram'
          scp -P "$SSH_PORT" compose.production.yaml "$SSH_USER@$SSH_HOST:foodgram/compose.yaml"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cd ~/foodgram && IMAGE_TAG=$GITHUB_SHA docker compose pull && IMAGE_TAG=$GITHUB_SHA docker compose up -d --wait --wait-timeout 180"
