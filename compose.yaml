name: foodgram
services:
  db:
    image: postgres:17-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DB_ENGINE: postgresql
      DB_HOST: db
    volumes:
      - static_data:/app/collected_static
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/tags/', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 12
    restart: unless-stopped
  frontend:
    build: ./frontend
    volumes:
      - frontend_data:/frontend
  nginx:
    build:
      context: .
      dockerfile: infra/Dockerfile
    ports:
      - "${PUBLIC_PORT:-8080}:80"
    volumes:
      - frontend_data:/usr/share/nginx/html:ro
      - static_data:/var/html/static:ro
      - media_data:/var/html/media:ro
    depends_on:
      frontend:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  static_data:
  media_data:
  frontend_data:
